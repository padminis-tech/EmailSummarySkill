apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-summary-mcp-server
  namespace: default
  labels:
    app: email-summary-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-summary-mcp-server
  template:
    metadata:
      labels:
        app: email-summary-mcp-server
    spec:
      containers:
        - name: email-summary-mcp-server
          image: ghcr.io/padminis-tech/email-summary-mcp-server:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: email-summary-mcp-server
  namespace: default
  labels:
    app: email-summary-mcp-server
spec:
  selector:
    app: email-summary-mcp-server
  ports:
    - name: http
      port: 80
      targetPort: 3000
