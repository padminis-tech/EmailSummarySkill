apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-summary-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-summary-mcp-server
  template:
    metadata:
      labels:
        app: email-summary-mcp-server
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: email-summary-mcp-server
        image: ghcr.io/padminis-tech/skills:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: email-summary-mcp-server
  namespace: default
spec:
  selector:
    app: email-summary-mcp-server
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: email-summary-mcp-server
  namespace: default
spec:
  hosts:
  - email-summary-mcp-server.c-55cc5d0.stage.kyma.ondemand.com
  apiVersion: v1
kind: Service
metadata:
  name: email-summary-mcp-server
  namespace: default
  labels:
    app: email-summary-mcp-server
spec:
  selector:
    app: email-summary-mcp-server
  ports:
    - name: http
      port: 80
      targetPort: 3000
