name: Build and Deploy Email Summary MCP Server

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/padminis-tech/email-summary-mcp-server:latest  # ← FIXED

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Kyma
        run: |
          echo "${{ secrets.KYMA_KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          kubectl label namespace default istio-injection=enabled --overwrite
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/email-summary-mcp-server -n default
