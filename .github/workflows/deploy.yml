name: Build and Deploy Email Summary MCP Server

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/padminis-tech/email-summary-mcp-server:latest  # ← FIXED

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

            - name: Deploy to Kyma
        env:
          CA_DATA: ${{ secrets.CA_DATA }}
          SA_TOKEN: ${{ secrets.SA_TOKEN }}
        run: |
          cat > kubeconfig.yaml <<EOF
apiVersion: v1
kind: Config
clusters:
- cluster:
    server: https://api.c-55cc5d0.stage.kyma.ondemand.com
    certificate-authority-data: $CA_DATA
  name: kyma-cluster
contexts:
- context:
    cluster: kyma-cluster
    user: github-actions-sa
  name: kyma-context
current-context: kyma-context
users:
- name: github-actions-sa
  user:
    token: $SA_TOKEN
EOF
          export KUBECONFIG=kubeconfig.yaml
          kubectl label namespace default istio-injection=enabled --overwrite
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/email-summary-mcp-server -n default
